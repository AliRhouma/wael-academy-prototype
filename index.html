<!doctype html>
<html lang="ar-TN" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Cairo is the default type system, display and interface alike: variable
         200–1000, covering Arabic AND Latin, so headings and body are real
         weights from one file and the Latin wordmark needs no second family.
         It also backs the local faces (Tarif, Lemon Brush — @font-face'd in
         src/styles/fonts.css) for the glyphs they don't ship. Playpen / Rubik /
         Cause / Tajawal, and the Roboto + Noto Sans Arabic pair, are only for the
         FontDock's comparison rows — drop them once a face is locked in. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Roboto:wght@100..900&family=Noto+Sans+Arabic:wght@100..900&family=Playpen+Sans+Arabic:wght@400..800&family=Rubik:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&family=Cause:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>أكاديمية وائل</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
