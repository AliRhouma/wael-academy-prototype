  </div>`;
  return { title: "الرئيسية", html };
};

/* screens that exist today and don't change in this update */
const same = (title, icon, body) => () => ({ title, back: "home", html: one(`<div style="max-width:560px;margin:1rem auto">${emptyBox(icon, `${title} — كيما توّا`, body, `<button class="cta" data-go="home">رجوع للرئيسية</button>`)}</div>`) });
R.calendar = same("الرزنامة", "calendar", "الصفحة هاذي موجودة في الفضاء الحالي وما تتبدّلش في التحديث. الجديد: الأحداث والمهام يتزادو فيها.");
/* recordings now open the live-sessions screen on its « التسجيلات » tab */ void same("تسجيلات", "tv", "موجودة في الفضاء الحالي. التسجيلات المسكّرة تولّي تتفتح بالقطع لمدّة.");

/* ---------- admin: ads ---------- */
const PLACES = { reward: "شاشة «اربح قطع»", home: "بانر في الرئيسية", between: "بين فيديوهين" };
R["admin-ads"] = () => {
  const f = (UI.adf ||= { name: "", offer: "خطوة بخطوة (الباكالوريا)", place: ["reward"], freq: 3, target: ["باك"], reward: 20, from: "2026-11-10", to: "2026-12-10" });
  const main = `<div class="panel"><header><h2>الحملات</h2><span class="tag ms-auto">${S.adsCfg.length}</span></header>
    <table class="tbl"><thead><tr><th>الحملة</th><th>العرض</th><th>البلايص</th><th>/نهار</th><th>مكافأة</th><th>مشاهدات</th><th>شغّالة</th></tr></thead><tbody>
    ${S.adsCfg.map((a) => `<tr><td class="b">${esc(a.name)}</td><td>${esc(a.offer)}</td><td>${a.place.map((p) => `<span class="tag">${PLACES[p]}</span>`).join(" ")}</td><td class="num">${a.freq}</td><td>${coins(a.reward)}</td><td class="num">${n(a.views)}</td><td><button class="switch" role="switch" aria-checked="${a.on}" data-act="adToggle" data-id="${a.id}" aria-label="شغّل/وقّف"></button></td></tr>`).join("")}</tbody></table></div>
    <form class="panel" data-submit="adSave" style="margin-top:1.2rem"><header><h2>حملة جديدة</h2></header><div class="form-grid">
      <div class="field"><label for="af-n">إسم الحملة</label><input id="af-n" class="input" required placeholder="مثلاً: عرض الأوائل — ديسمبر" value="${esc(f.name)}" oninput="UI.adf.name=this.value;adPrev()"></div>
      <div class="field"><label for="af-o">العرض اللي نروّجولو</label><select id="af-o" class="input" onchange="UI.adf.offer=this.value;adPrev()">${["خطوة بخطوة (الباكالوريا)", "خطوة بخطوة للنموذجي", "عرض الأوائل", "مكتبة وائل — Pack Bac"].map((o) => `<option ${f.offer === o ? "selected" : ""}>${o}</option>`).join("")}</select></div>
      <div class="field full"><span class="lbl">وين يظهر</span><div class="chips">${Object.entries(PLACES).map(([k, l]) => `<button type="button" class="chip" aria-pressed="${f.place.includes(k)}" data-act="afPlace" data-v="${k}">${l}</button>`).join("")}</div></div>
      <div class="field"><label for="af-f">أكثر عدد في النهار لكل تلميذ: <b id="af-fv">${f.freq}</b></label><input id="af-f" type="range" min="1" max="5" value="${f.freq}" oninput="UI.adf.freq=+this.value;document.getElementById('af-fv').textContent=this.value"><span class="tiny">ننصحو بـ 3 ولا أقل — أكثر يقلّق التلاميذ.</span></div>
      <div class="field"><label for="af-r">المكافأة (قطع)</label><input id="af-r" type="number" min="5" max="100" class="input" value="${f.reward}" oninput="UI.adf.reward=+this.value;adPrev()"></div>
      <div class="field full"><span class="lbl">الجمهور</span><div class="chips">${["باك", "3ème ثانوي", "2ème ثانوي", "9ème أساسي", "علوم تجريبية", "رياضيات", "آداب", "تونس الكبرى", "الساحل", "صفاقس"].map((t) => `<button type="button" class="chip" aria-pressed="${f.target.includes(t)}" data-act="afTarget" data-v="${t}">${t}</button>`).join("")}</div></div>
      <div class="field"><label for="af-a">من</label><input id="af-a" type="date" class="input" value="${f.from}" onchange="UI.adf.from=this.value"></div><div class="field"><label for="af-b">لين</label><input id="af-b" type="date" class="input" value="${f.to}" onchange="UI.adf.to=this.value"></div>
    </div><div class="row" style="margin-top:1rem"><span class="tiny">التقدير: ~<b>${n(3200 * f.target.length)}</b> تلميذ</span><button class="cta lg ms-auto" type="submit">${I("check")} سجّل الحملة</button></div></form>`;
  const side = `<div class="panel col" style="gap:.7rem"><header><h2>معاينة كيف يشوفها التلميذ</h2></header><div id="adPreview">${adPreview(f)}</div><p class="tiny">${I("info", "s")} التلميذ يختار يتفرّج. ينجم يسكّر وقتلّي يحب؛ القطع كي يكمّل برك.</p></div>`;
  return { title: "الإعلانات", back: "admin-ads", html: split(main, side) };
};
function adPreview(f) {
  return `<div class="preview-phone"><div><div class="col" style="align-items:center;text-align:center;gap:.3rem;padding:.6rem"><span class="tag lime">${esc(f.offer.split(" (")[0])}</span><b style="font-size:1.1rem">${esc(f.name) || "إسم الحملة"}</b><span class="tiny" style="color:rgb(255 255 255 / .8)">إعلان · 15 ث</span></div></div></div>
    <div class="panel row" style="padding:.6rem;border-radius:16px">${I("tv")}<div class="grow"><div class="b small">تفرّج في إعلان</div><div class="tiny">${f.place.map((p) => PLACES[p]).join(" · ") || "اختار بلاصة"}</div></div><span class="money">+${n(f.reward || 0)}${COIN}</span></div>`;
}
window.adPrev = () => { const el = $("#adPreview"); if (el) el.innerHTML = adPreview(UI.adf); };
ACT.afPlace = (el) => { const a = UI.adf.place, v = el.dataset.v; UI.adf.place = a.includes(v) ? a.filter((x) => x !== v) : [...a, v]; refresh(); };
ACT.afTarget = (el) => { const a = UI.adf.target, v = el.dataset.v; UI.adf.target = a.includes(v) ? a.filter((x) => x !== v) : [...a, v]; refresh(); };
ACT.adToggle = (el) => { const a = S.adsCfg.find((x) => x.id === el.dataset.id); a.on = !a.on; refresh(); toast(a.on ? "الحملة شغّالة" : "الحملة موقوفة", a.on ? "play" : "pause"); };
ACT.adSave = (f) => { const a = UI.adf; if (!a.name.trim()) { shake($("#af-n")); return toast("عطي إسم للحملة", "edit"); } if (!a.place.length) return toast("اختار بلاصة وحدة على الأقل", "info");
  S.adsCfg.unshift({ id: "ad" + Date.now(), name: a.name, offer: a.offer, place: a.place, freq: a.freq, target: a.target.join(" · "), reward: a.reward, on: true, views: 0 }); UI.adf = null; refresh(); toast("الحملة تسجّلت وشغّالة", "megaphone"); };

/* ---------- admin: launch an event ---------- */
R["admin-event"] = () => {
  const f = (UI.evf ||= { t: "", subj: "math", type: "bracket", date: "2026-11-21", time: "15:00", days: 3, prize: 1500, cap: 128 });
  const ev0 = { t: f.t || "إسم الحدث", sub: f.type === "bracket" ? "إقصائيات · 1 ضد 1" : "ترتيب مفتوح", subj: f.subj, prize: +f.prize || 0, state: "soon", when: `يبدا ${f.date} · ${f.time}`, n: 0, cap: +f.cap, joined: false };
  const main = `<form class="panel" data-submit="evPublish"><div class="form-grid">
    <div class="field full"><label for="ef-t">العنوان</label><input id="ef-t" class="input" required placeholder="مثلاً: كأس الفيزياء — ديسمبر" value="${esc(f.t)}" oninput="UI.evf.t=this.value;evPrev()"></div>
    <div class="field"><label for="ef-s">المادّة</label><select id="ef-s" class="input" onchange="UI.evf.subj=this.value;evPrev()">${Object.entries(SUBJ).map(([k, s]) => `<option value="${k}" ${f.subj === k ? "selected" : ""}>${s.ar}</option>`).join("")}</select></div>
    <div class="field"><span class="lbl">النوع</span><div class="seg">${[["bracket", "إقصائيات"], ["rank", "ترتيب مفتوح"]].map(([v, l]) => `<button type="button" class="chip" aria-pressed="${f.type === v}" data-act="efType" data-v="${v}">${l}</button>`).join("")}</div></div>
    <div class="field"><label for="ef-d">نهار البداية</label><input id="ef-d" type="date" class="input" value="${f.date}" onchange="UI.evf.date=this.value;evPrev()"></div>
    <div class="field"><label for="ef-h">الوقت</label><input id="ef-h" type="time" class="input" value="${f.time}" onchange="UI.evf.time=this.value;evPrev()"></div>
    <div class="field"><label for="ef-p">مجموع الجوائز (قطع)</label><input id="ef-p" type="number" min="0" step="100" class="input" value="${f.prize}" oninput="UI.evf.prize=this.value;evPrev()"><span class="tiny">يتقسم 50٪ · 30٪ · 20٪ على الثلاثة الأولين</span></div>
    <div class="field"><label for="ef-c">أكثر عدد مشاركين</label><input id="ef-c" type="number" min="8" step="8" class="input" value="${f.cap}" oninput="UI.evf.cap=this.value;evPrev()"></div>
    <div class="field full"><label for="ef-r">القوانين</label><textarea id="ef-r" class="input">مجاني. 10 أسئلة بالوقت في كل مقابلة. أي غشّ يخرجك من الحدث.</textarea></div>
  </div><div class="row" style="margin-top:1rem"><button type="button" class="btn" data-act="evDraft">سجّل مسودّة</button><button class="cta lg ms-auto" type="submit">${I("flag")} انشر الحدث</button></div></form>`;
  const side = `<div class="panel col" style="gap:.7rem"><header><h2>معاينة في «الأحداث»</h2></header><div id="evPreview">${evPreviewHtml(ev0)}</div></div>`;
  return { title: "إطلاق حدث", back: "admin-ads", html: split(main, side) };
};
const evPreviewHtml = (e) => `<div class="tile" style="padding:.9rem;display:flex;flex-direction:column;gap:.45rem;pointer-events:none"><div class="row"><span class="tag brand">جاي</span>${subjTag(e.subj)}</div><h3>${esc(e.t)}</h3><div class="tiny">${e.sub}</div><div class="row"><span class="money" style="font-size:1.2rem">${COIN}${n(e.prize)}</span><span class="tiny ms-auto">${e.when}</span></div>${bar(0, "thin brand")}<span class="tiny">0 / ${n(e.cap)} مشارك</span></div>
  <div class="grid prize3" style="margin-top:.6rem">${[.5, .3, .2].map((p, i) => `<div class="panel col" style="align-items:center;padding:.5rem"><b class="small">${i + 1}</b><span class="money small">${COIN}${n(Math.round(e.prize * p))}</span></div>`).join("")}</div>`;
window.evPrev = () => { const f = UI.evf, el = $("#evPreview"); if (el) el.innerHTML = evPreviewHtml({ t: f.t || "إسم الحدث", sub: f.type === "bracket" ? "إقصائيات · 1 ضد 1" : "ترتيب مفتوح", subj: f.subj, prize: +f.prize || 0, when: `يبدا ${f.date} · ${f.time}`, cap: +f.cap }); };
ACT.efType = (el) => { UI.evf.type = el.dataset.v; refresh(); };
ACT.evDraft = () => toast("تسجّلت مسودّة — ما تظهرش للتلاميذ", "file");
ACT.evPublish = () => { const f = UI.evf; if (!f.t.trim()) { shake($("#ef-t")); return toast("عطي عنوان للحدث", "edit"); }
  dialog(`<h3>تنشر «${esc(f.t)}»؟</h3><p class="small muted">يظهر توّا لكل التلاميذ في «الأحداث» ويوصلهم تنبيه. الجوائز (${coins(+f.prize)}) تتقسم كي يكمّل.</p><div class="dialog-actions"><button class="btn" data-close>لا</button><button class="cta" data-act="evPublishOk">${I("flag")} انشر</button></div>`); };
ACT.evPublishOk = () => { const f = UI.evf; S.events.unshift({ id: "ev-" + Date.now(), t: f.t, sub: f.type === "bracket" ? "إقصائيات · 1 ضد 1" : "ترتيب مفتوح", subj: f.subj, prize: +f.prize, state: "soon", when: `يبدا ${f.date} · ${f.time}`, start: Date.now() + 16 * 24 * H, n: 0, cap: +f.cap, type: f.type, joined: false });
  UI.evf = null; closeDialog(); refresh(); dialog(`<h3>الحدث تنشر</h3><p class="small muted">التلاميذ يشوفوه توّا في «الأحداث».</p><div class="dialog-actions"><button class="btn" data-close>تمام</button><button class="cta" data-go="events">${I("eye")} شوفو كي تلميذ</button></div>`); };

render();

</script>
