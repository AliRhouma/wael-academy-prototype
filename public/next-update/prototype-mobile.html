<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08434b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>وائل أكاديمي — التحديث الجاي · التطبيق (أفقي)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Wael Academy — next update prototype · shared core
   Tokens copied from src/styles/v2.css (the élève space's own palette) and
   src/styles/skins/play.css (the gamified skin's derived edges). Cairo is the
   one family (src/styles/fonts.css). Sizes in rem: each file sets its own root.
   ========================================================================== */
:root {
  --ink: #172e5b; --ink-2: #586989; --ink-3: #687794;
  --surface: #ffffff;
  --brand: #0491a5; --brand-text: #036b7a; --deep: #08434b;
  --cta: #8aff6b; --on-cta: #172e5b;
  --live: #ff3b3e; --live-strong: #c8191c; --live-soft: #ffe2e2;
  --done: #f28b14; --done-line: #f9b86c;
  --chip-live: #8eb1ff; --chip-docs: #a179ff; --violet: #7b4ddb;
  --grad: linear-gradient(135deg, #0491a5 0%, #8aff6b 100%);
  --canvas: linear-gradient(to left, rgb(4 145 165 / .1), rgb(138 255 107 / .1));
  --chapter: linear-gradient(150deg, #0a7d8e 0%, #08434b 62%, #062f36 100%);
  /* play skin — derived edges, no new hue */
  --edge-cta: #5bcd3f; --edge-brand: #036b7a; --edge-deep: #052a30; --edge-live: #c92c2f;
  --edge-done: #b9680b; --edge-violet: #5a35ae; --edge-ink: #0e1d3c;
  --edge-tile: rgb(23 46 91 / .14); --line: rgb(23 46 91 / .15); --track: rgb(23 46 91 / .10);
  /* subject hues (saturated "dot" reads of src/features/student/subjectTint.ts) */
  --s-math: #3f9a5c; --s-phys: #4a7fd4; --s-svt: #1fa3b8; --s-lang: #d9902b; --s-philo: #7b4ddb; --s-info: #172e5b;
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
  --ease-out: cubic-bezier(.22, 1, .36, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: "Cairo", system-ui, sans-serif; color: var(--ink);
  font-synthesis: none; -webkit-font-smoothing: antialiased; line-height: 1.45;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
svg { flex-shrink: 0; }
.ltr { direction: ltr; unicode-bidi: isolate; }
bdi { unicode-bidi: isolate; }
.num { font-variant-numeric: tabular-nums; font-weight: 800; }
.muted { color: var(--ink-2); }
.tiny { font-size: .78rem; color: var(--ink-2); }
.small { font-size: .88rem; }
.b { font-weight: 800; }
.row { display: flex; align-items: center; gap: .5rem; }
.col { display: flex; flex-direction: column; gap: .5rem; }
.grow { flex: 1; min-width: 0; }
.wrap { flex-wrap: wrap; }
.center { display: grid; place-items: center; }
.ms-auto { margin-inline-start: auto; }
.hide { display: none !important; }
.ic { width: 1.25em; height: 1.25em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ic.s { width: 1em; height: 1em; }
.ic.l { width: 1.6em; height: 1.6em; }
.flip { transform: scaleX(-1); }
h1, h2, h3, h4 { margin: 0; font-weight: 800; line-height: 1.25; }
p { margin: 0; }

/* ---------- Pressables: the play skin's lips ---------- */
.cta, .btn, .tile, .chip, .icon-btn, .btn-live {
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  transition: translate 180ms var(--ease-spring), box-shadow 180ms var(--ease-spring), background-color 150ms, border-color 150ms, color 150ms, filter 150ms;
}
:is(.cta, .btn, .tile, .chip, .icon-btn, .btn-live):active { transition-duration: 80ms; transition-timing-function: linear; }
:is(.cta, .btn, .tile, .chip, .icon-btn, .btn-live, a, input, select, textarea):focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
.cta {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  min-height: 44px; padding: 0 1.25rem; border-radius: 999px;
  background: var(--cta); color: var(--on-cta); font-weight: 800; font-size: 1rem;
  box-shadow: 0 4px 0 0 var(--edge-cta); white-space: nowrap;
}
.cta:hover { filter: brightness(1.03); }
.cta:active { translate: 0 4px; box-shadow: 0 0 0 0 var(--edge-cta); }
.cta.lg { min-height: 52px; font-size: 1.1rem; padding: 0 1.6rem; }
.cta.block, .btn.block { width: 100%; }
.cta[aria-disabled="true"] { box-shadow: none; background: color-mix(in srgb, var(--ink) 8%, white); color: var(--ink-2); }
.cta[aria-disabled="true"]:active { translate: 0 0; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
  min-height: 44px; padding: 0 1.1rem; border-radius: 999px;
  background: var(--surface); border: 2px solid var(--line); font-weight: 700;
  box-shadow: 0 3px 0 0 var(--edge-tile); white-space: nowrap;
}
.btn:hover { border-color: color-mix(in srgb, var(--ink) 30%, transparent); }
.btn:active { translate: 0 3px; box-shadow: 0 0 0 0 var(--edge-tile); }
.btn.sm, .cta.sm { min-height: 36px; padding: 0 .85rem; font-size: .88rem; }
.btn.sm::before, .cta.sm::before { content: ""; position: absolute; inset: -4px 0; } /* keep a 44px hit */
.btn.sm, .cta.sm { position: relative; }
.btn-live {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem; min-height: 44px; padding: 0 1.1rem;
  border-radius: 999px; border: 2px solid var(--live); background: rgb(255 59 62 / .12); color: var(--live-strong);
  font-weight: 800; box-shadow: 0 2px 0 0 var(--edge-live);
}
.btn-live:active { translate: 0 2px; box-shadow: none; }
.icon-btn {
  display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 999px;
  background: var(--surface); border: 2px solid var(--line); box-shadow: 0 3px 0 0 var(--edge-tile); position: relative;
}
.icon-btn:active { translate: 0 3px; box-shadow: none; }
.icon-btn.flat { border: 0; box-shadow: none; background: transparent; }
.icon-btn.flat:active { translate: 0 0; background: rgb(23 46 91 / .06); }
.dot-badge { position: absolute; top: -2px; inset-inline-end: -2px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 999px; background: var(--live); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; border: 2px solid var(--surface); }

.tile {
  --lip: var(--edge-tile);
  display: block; text-align: start; background: var(--surface); border-radius: 18px;
  border: 2px solid var(--tile-line, var(--line)); box-shadow: 0 3px 0 0 var(--lip); position: relative;
}
@media (hover: hover) { .tile:hover { translate: 0 -2px; box-shadow: 0 5px 0 0 var(--lip); } }
.tile:active { translate: 0 3px; box-shadow: 0 0 0 0 var(--lip); }
.tile[data-locked="true"] { --lip: transparent; border-style: dashed; border-color: rgb(23 46 91 / .25); box-shadow: none; }
.tile[data-locked="true"]:hover, .tile[data-locked="true"]:active { translate: 0 0; box-shadow: none; }
.tile[data-on="true"] { border-color: var(--edge-cta); --lip: var(--edge-cta); background: color-mix(in srgb, var(--cta) 18%, white); }

.panel { background: var(--surface); border: 2px solid var(--line); border-radius: 24px; padding: 1.1rem; min-width: 0; }
.panel > header { display: flex; align-items: center; gap: .65rem; margin-bottom: .85rem; min-height: 40px; }
.panel > header h2 { font-size: 1.12rem; }
.chipglyph { width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; color: #fff; flex-shrink: 0; }
.chipglyph .ic { width: 20px; height: 20px; }
.plate { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff; flex-shrink: 0; }
.plate .ic { width: 20px; height: 20px; }

.chip {
  display: inline-flex; align-items: center; gap: .35rem; min-height: 38px; padding: 0 .9rem; border-radius: 999px;
  border: 2px solid var(--line); background: var(--surface); font-weight: 700; font-size: .9rem; white-space: nowrap; position: relative;
}
.chip::before { content: ""; position: absolute; inset: -4px 0; }
.chip[aria-pressed="true"] { background: var(--cta); border-color: var(--edge-cta); box-shadow: 0 2px 0 0 var(--edge-cta); font-weight: 800; color: var(--on-cta); }
.chip:active { translate: 0 2px; box-shadow: none; }
.chips { display: flex; gap: .45rem; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 4px; border-radius: 999px; background: rgb(23 46 91 / .06); gap: 2px; }
.seg .chip { border: 0; background: transparent; }
.seg .chip[aria-pressed="true"] { background: var(--cta); }

.tag { display: inline-flex; align-items: center; gap: .25rem; padding: .1rem .55rem; border-radius: 8px; font-size: .78rem; font-weight: 800; background: rgb(23 46 91 / .06); color: var(--ink); white-space: nowrap; }
.tag.brand { background: rgb(4 145 165 / .12); color: var(--brand-text); }
.tag.live { background: var(--live-soft); color: var(--live-strong); }
.tag.done { background: rgb(242 139 20 / .14); color: var(--edge-done); }
.tag.lime { background: var(--cta); color: var(--on-cta); }
.tag.violet { background: rgb(123 77 219 / .12); color: var(--edge-violet); }

/* progress: 12px striped bar */
.bar { height: 12px; border-radius: 999px; background: var(--track); overflow: hidden; position: relative; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--cta); position: relative; transition: width 500ms var(--ease-out); }
.bar > i::after { content: ""; position: absolute; inset: 2px 6px auto; height: 3px; border-radius: 3px; background: rgb(255 255 255 / .55); }
.bar.brand > i { background: var(--brand); }
.bar.thin { height: 8px; }
.bar.thin > i::after { display: none; }
.ring { position: relative; display: inline-grid; place-items: center; }
.ring svg { position: absolute; inset: 0; width: 100%; height: 100%; rotate: -90deg; }
.ring .trk { stroke: var(--track); }
.ring .fil { stroke: var(--cta); stroke-linecap: round; transition: stroke-dashoffset 600ms var(--ease-out); }

.stamp { display: inline-block; rotate: -6deg; border: 2px solid var(--done); color: var(--edge-done); font-weight: 800; border-radius: 10px; padding: .1rem .6rem; background: var(--surface); }
.stamp.cta { border-color: var(--edge-cta); color: var(--on-cta); background: var(--cta); }

/* coin + gem glyphs */
.coin { display: inline-block; width: 1.15em; height: 1.15em; vertical-align: -.2em; }
.gem { display: inline-block; width: 1.1em; height: 1.1em; vertical-align: -.18em; }
.money { display: inline-flex; align-items: center; gap: .25rem; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill {
  display: inline-flex; align-items: center; gap: .4rem; min-height: 40px; padding: 0 .5rem 0 .85rem; border-radius: 999px;
  background: var(--surface); border: 2px solid var(--line); font-weight: 800; box-shadow: 0 3px 0 0 var(--edge-tile); position: relative;
}
.pill:active { translate: 0 3px; box-shadow: none; }
.pill .plus { width: 24px; height: 24px; border-radius: 999px; background: var(--cta); display: grid; place-items: center; box-shadow: 0 2px 0 var(--edge-cta); }
.pill .plus .ic { width: 14px; height: 14px; stroke-width: 3; }

/* avatars */
.av { width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: .85rem; flex-shrink: 0; border: 2px solid var(--surface); }
.av.sm { width: 28px; height: 28px; font-size: .72rem; }
.av.lg { width: 52px; height: 52px; font-size: 1.1rem; }
.avs { display: flex; }
.avs .av { margin-inline-start: -8px; }
.avs .av:first-child { margin-inline-start: 0; }

/* lists */
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: .75rem; min-height: 56px; padding: .55rem 0; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
button.li { width: 100%; text-align: start; }
button.li:active { background: rgb(23 46 91 / .04); }

/* forms */
.field { display: flex; flex-direction: column; gap: .3rem; }
.field label, .lbl { font-weight: 700; font-size: .88rem; }
.input, select.input, textarea.input {
  min-height: 46px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); padding: 0 .9rem; font-size: max(16px, 1rem); width: 100%;
}
textarea.input { padding: .6rem .9rem; min-height: 90px; resize: vertical; }
.input:focus { border-color: var(--brand); outline: none; }
.check { display: flex; align-items: center; gap: .6rem; min-height: 44px; cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--brand); }
.switch { width: 50px; height: 30px; border-radius: 999px; background: var(--track); position: relative; transition: background 200ms; flex-shrink: 0; }
.switch::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 24px; height: 24px; border-radius: 999px; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .2); transition: inset-inline-start 200ms var(--ease-spring); }
.switch[aria-checked="true"] { background: var(--brand); }
.switch[aria-checked="true"]::after { inset-inline-start: 23px; }
input[type="range"] { accent-color: var(--brand); width: 100%; }

/* empty state */
.empty { border: 2px dashed var(--line); border-radius: 20px; padding: 1.4rem; text-align: center; display: flex; flex-direction: column; align-items: center; gap: .5rem; }
.empty .plate { background: rgb(4 145 165 / .1); color: var(--brand-text); width: 52px; height: 52px; border-radius: 16px; }

/* dialog + scrim */
.scrim { position: absolute; inset: 0; background: rgb(8 20 40 / .45); z-index: 80; display: grid; place-items: center; padding: 16px; animation: fade 200ms; }
.dialog { background: var(--surface); border-radius: 24px; width: min(460px, 100%); max-height: 100%; overflow: auto; padding: 1.25rem; position: relative; animation: rise 260ms var(--ease-out); }
.dialog h3 { font-size: 1.2rem; margin-bottom: .35rem; }
.dialog .x { position: absolute; top: 10px; inset-inline-end: 10px; }
.dialog-actions { display: flex; gap: .6rem; margin-top: 1rem; justify-content: flex-end; flex-wrap: wrap; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; translate: 0 10px; } }

/* toast */
.toasts { position: absolute; top: 12px; left: 50%; translate: -50% 0; z-index: 120; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { background: var(--ink); color: #fff; padding: .55rem 1rem; border-radius: 999px; font-weight: 700; font-size: .92rem; display: flex; align-items: center; gap: .5rem; box-shadow: 0 10px 24px -12px rgb(8 67 75 / .6); animation: toast 2600ms var(--ease-out) forwards; white-space: nowrap; }
.toast .ic { color: var(--cta); }
@keyframes toast { 0% { opacity: 0; translate: 0 -10px; } 8%, 85% { opacity: 1; translate: 0 0; } 100% { opacity: 0; translate: 0 -6px; } }

/* burst — the one celebration (16 particles, 620ms) */
.burst { position: absolute; width: 0; height: 0; pointer-events: none; z-index: 130; }
.burst i { position: absolute; width: 8px; height: 8px; border-radius: 2px; animation: burst 620ms var(--ease-out) forwards; }
@keyframes burst { from { transform: translate(0, 0) rotate(0); opacity: 1; } to { transform: translate(var(--x), var(--y)) rotate(200deg); opacity: 0; } }
.pop { animation: pop 320ms var(--ease-spring); }
@keyframes pop { 0% { scale: .6; } 60% { scale: 1.15; } 100% { scale: 1; } }
.shake { animation: shake 320ms; }
@keyframes shake { 0%, 100% { translate: 0; } 20% { translate: -4px; } 40% { translate: 4px; } 60% { translate: -3px; } 80% { translate: 3px; } }
.rise-in > * { animation: rise 240ms var(--ease-out) backwards; }
.rise-in > *:nth-child(2) { animation-delay: 40ms; } .rise-in > *:nth-child(3) { animation-delay: 80ms; } .rise-in > *:nth-child(4) { animation-delay: 120ms; } .rise-in > *:nth-child(5) { animation-delay: 160ms; } .rise-in > *:nth-child(n+6) { animation-delay: 200ms; }
.live-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--live); display: inline-block; position: relative; }
.live-dot::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--live); animation: onair 1.8s cubic-bezier(.2, .7, .3, 1) infinite; }
@keyframes onair { from { transform: scale(1); opacity: .55; } to { transform: scale(2.6); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
  .burst { display: none; }
}

/* ---------- Shared screen pieces ---------- */
.grid { display: grid; gap: .9rem; }
.kicker { font-size: .78rem; font-weight: 800; color: var(--brand-text); }
.sec-title { display: flex; align-items: center; gap: .5rem; margin: .2rem 0 .6rem; }
.sec-title h3 { font-size: 1.05rem; }
.stat { display: flex; flex-direction: column; gap: .1rem; }
.stat .v { font-size: 1.5rem; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .k { font-size: .8rem; color: var(--ink-2); font-weight: 600; }
.hero-deep { background: var(--chapter); color: #fff; border-radius: 24px; padding: 1.1rem 1.25rem; position: relative; overflow: hidden; }
.hero-deep .muted, .hero-deep .tiny { color: rgb(255 255 255 / .78); }
.hero-deep::after { content: ""; position: absolute; inset-inline-end: -40px; top: -60px; width: 200px; height: 200px; border-radius: 999px; background: radial-gradient(circle, rgb(138 255 107 / .25), transparent 70%); }

/* content cards (matières) */
.mcard { padding: .8rem; display: flex; flex-direction: column; gap: .45rem; min-height: 100%; }
.mcard .top { display: flex; gap: .6rem; align-items: flex-start; }
.mcard h4 { font-size: .98rem; line-height: 1.3; }
.mcard .meta { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
.mcard .foot { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-top: auto; padding-top: .35rem; }
.countdown { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--brand-text); }
.kind-pdf { background: var(--violet); } .kind-video { background: var(--brand); } .kind-live { background: var(--live); }
.kind-rec { background: var(--deep); } .kind-quiz { background: var(--cta); color: var(--on-cta) !important; } .kind-exam { background: var(--ink); } .kind-ex { background: var(--s-math); }

/* products */
.pimg { border-radius: 14px; aspect-ratio: 4/3; display: grid; place-items: center; position: relative; overflow: hidden; }
.pimg svg.book { width: 46%; height: auto; filter: drop-shadow(0 6px 0 rgb(23 46 91 / .12)); }

/* stepper */
.steps { display: flex; gap: .4rem; align-items: center; }
.steps .st { display: flex; align-items: center; gap: .35rem; font-weight: 700; font-size: .85rem; color: var(--ink-2); }
.steps .st b { width: 26px; height: 26px; border-radius: 999px; display: grid; place-items: center; background: var(--track); color: var(--ink); font-size: .8rem; }
.steps .st.on b { background: var(--cta); box-shadow: 0 2px 0 var(--edge-cta); }
.steps .st.ok b { background: var(--brand); color: #fff; }
.steps .sep { flex: 1; height: 3px; border-radius: 3px; background: var(--track); min-width: 12px; }
.track-v { display: flex; flex-direction: column; gap: 0; }
.track-v .tv { display: flex; gap: .7rem; position: relative; padding-bottom: 1rem; }
.track-v .tv::before { content: ""; position: absolute; inset-inline-start: 13px; top: 28px; bottom: 0; width: 3px; background: var(--track); border-radius: 3px; }
.track-v .tv:last-child::before { display: none; }
.track-v .tv.ok::before { background: var(--brand); }
.track-v .tv b { width: 29px; height: 29px; border-radius: 999px; background: var(--track); display: grid; place-items: center; flex-shrink: 0; }
.track-v .tv.ok b { background: var(--brand); color: #fff; }
.track-v .tv.on b { background: var(--cta); box-shadow: 0 3px 0 var(--edge-cta); }

/* quiz options */
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.opt { min-height: 56px; padding: .55rem .8rem; display: flex; align-items: center; gap: .6rem; font-weight: 700; }
.opt .k { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-weight: 900; color: #fff; flex-shrink: 0; }
.opt[data-state="picked"] { border-color: var(--brand); --lip: var(--edge-brand); background: rgb(4 145 165 / .08); }
.opt[data-state="right"] { border-color: var(--edge-cta); --lip: var(--edge-cta); background: color-mix(in srgb, var(--cta) 30%, white); }
.opt[data-state="wrong"] { border-color: var(--live); --lip: var(--edge-live); background: var(--live-soft); }
.opt[data-state="dim"] { opacity: .5; }

/* chat */
.chat { display: flex; flex-direction: column; min-height: 0; }
.chat .msgs { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: .45rem; padding: .25rem; }
.msg { display: flex; gap: .45rem; align-items: flex-end; max-width: 92%; }
.msg .bub { background: rgb(23 46 91 / .06); padding: .4rem .7rem; border-radius: 14px; border-end-start-radius: 4px; font-size: .9rem; }
.msg .who { font-size: .72rem; font-weight: 800; color: var(--brand-text); }
.msg.me { align-self: flex-end; flex-direction: row-reverse; }
.msg.me .bub { background: var(--brand); color: #fff; border-end-start-radius: 14px; border-end-end-radius: 4px; }
.msg.sys { align-self: center; } .msg.sys .bub { background: transparent; color: var(--ink-2); font-size: .78rem; font-weight: 700; }
.chat form { display: flex; gap: .4rem; padding-top: .4rem; }

/* town */
.town-wrap { position: relative; overflow: hidden; background: #d4eef1; }
.town-svg { width: 100%; height: 100%; display: block; }
.bld { cursor: pointer; transition: translate 180ms var(--ease-spring); }
.bld:active { translate: 0 3px; }
.bld .sel-ring { opacity: 0; transition: opacity 200ms; }
.bld.sel .sel-ring { opacity: 1; }
.bld.locked { cursor: not-allowed; }
.bld .scaff { opacity: 0; transition: opacity 250ms; }
.bld.building .scaff { opacity: 1; }
.bld.building .body { opacity: .55; }
.bld .up { transform-box: fill-box; transform-origin: center; }
.lvl-badge text { font-weight: 900; font-family: "Cairo", system-ui; }
.hud { position: absolute; z-index: 5; display: flex; gap: .5rem; align-items: center; }
.hud .pill { background: rgb(255 255 255 / .94); }
.bpanel { position: absolute; z-index: 10; background: var(--surface); border: 2px solid var(--line); border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; animation: slidein 280ms var(--ease-out); }
@keyframes slidein { from { opacity: 0; translate: -24px 0; } }
.bpanel .bp-body { overflow: auto; padding: 1rem; display: flex; flex-direction: column; gap: .7rem; }
.bpanel .bp-foot { padding: .75rem 1rem; border-top: 1px solid var(--line); }
.need { display: grid; grid-template-columns: auto 1fr auto; gap: .55rem; align-items: center; }

/* league */
.tiers { display: flex; gap: .4rem; align-items: flex-end; }
.tier { display: flex; flex-direction: column; align-items: center; gap: .2rem; font-size: .75rem; font-weight: 800; color: var(--ink-2); flex: 1; }
.tier svg { width: 38px; height: 38px; }
.tier.me { color: var(--ink); }
.tier.me svg { width: 52px; height: 52px; }
.tier.lock svg { opacity: .35; }
.rank { display: grid; grid-template-columns: 34px 36px 1fr auto; align-items: center; gap: .6rem; min-height: 52px; padding: .35rem .6rem; border-radius: 14px; }
.rank .pos { font-weight: 900; text-align: center; font-variant-numeric: tabular-nums; }
.rank.me { background: color-mix(in srgb, var(--cta) 30%, white); border: 2px solid var(--edge-cta); }
.rank.gap { min-height: 26px; color: var(--ink-3); justify-content: center; display: flex; font-weight: 800; letter-spacing: 0; }
.zone { font-size: .75rem; font-weight: 800; padding: .25rem .6rem; border-radius: 8px; display: flex; gap: .35rem; align-items: center; }
.zone.up { background: color-mix(in srgb, var(--cta) 30%, white); color: var(--on-cta); }
.badge-tile { display: flex; flex-direction: column; align-items: center; gap: .3rem; text-align: center; padding: .7rem .4rem; }
.badge-tile svg { width: 46px; height: 46px; }
.badge-tile.locked svg { filter: grayscale(1); opacity: .4; }

/* bracket */
.bracket { display: grid; grid-template-columns: repeat(3, minmax(150px, 1fr)); gap: 1.2rem; align-items: center; }
.bracket .round { display: flex; flex-direction: column; gap: .7rem; justify-content: space-around; height: 100%; }
.match { border: 2px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
.match .p { display: flex; align-items: center; gap: .45rem; padding: .35rem .6rem; font-size: .85rem; font-weight: 700; min-height: 36px; }
.match .p + .p { border-top: 1px solid var(--line); }
.match .p.win { background: color-mix(in srgb, var(--cta) 25%, white); }
.match .p.me { color: var(--brand-text); font-weight: 900; }
.match .p .sc { margin-inline-start: auto; font-variant-numeric: tabular-nums; font-weight: 900; }

/* planner */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: .4rem; }
.wday { border: 2px solid var(--line); border-radius: 14px; padding: .4rem; min-height: 120px; display: flex; flex-direction: column; gap: .3rem; background: var(--surface); }
.wday.today { border-color: var(--ink); }
.wday .dn { font-size: .75rem; font-weight: 800; color: var(--ink-2); display: flex; justify-content: space-between; }
.blk { border-radius: 9px; padding: .2rem .4rem; font-size: .72rem; font-weight: 800; color: #fff; line-height: 1.3; }

/* AI */
.paper { background: #fffdf7; border-radius: 12px; border: 2px solid var(--line); position: relative; overflow: hidden; background-image: repeating-linear-gradient(to bottom, transparent 0 27px, rgb(4 145 165 / .14) 27px 28px); }
.paper .ln { font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive; direction: ltr; text-align: left; padding: 0 14px; height: 28px; line-height: 28px; color: #1f3a7a; font-size: 15px; white-space: nowrap; position: relative; }
.paper .ln.ok { background: rgb(138 255 107 / .22); }
.paper .ln.bad { background: rgb(255 59 62 / .12); }
.paper .ln .mk { position: absolute; right: 8px; top: 4px; width: 20px; height: 20px; border-radius: 999px; display: grid; place-items: center; color: #fff; }
.paper .ln.ok .mk { background: var(--edge-cta); } .paper .ln.bad .mk { background: var(--live); }
.scanline { position: absolute; left: 0; right: 0; height: 40px; background: linear-gradient(to bottom, transparent, rgb(138 255 107 / .5), transparent); animation: scan 1.4s linear infinite; }
@keyframes scan { from { top: -40px; } to { top: 100%; } }
.viewfinder { position: relative; border-radius: 20px; overflow: hidden; background: #22303f; display: grid; place-items: center; }
.viewfinder .corner { position: absolute; width: 28px; height: 28px; border: 4px solid var(--cta); }
.shutter { width: 64px; height: 64px; border-radius: 999px; background: #fff; border: 5px solid var(--cta); box-shadow: 0 4px 0 var(--edge-cta); }
.shutter:active { translate: 0 4px; box-shadow: none; }

/* ad player */
.adplayer { position: absolute; inset: 0; z-index: 90; background: #06222a; color: #fff; display: flex; flex-direction: column; }
.adplayer .adtop { display: flex; align-items: center; gap: .6rem; padding: 10px 14px; }
.adplayer .adstage { flex: 1; position: relative; overflow: hidden; display: grid; place-items: center; background: var(--chapter); }

/* ---------- shared extras ---------- */
.scroller { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 6px; }
.scroller::-webkit-scrollbar { display: none; }
.search { position: relative; display: flex; align-items: center; }
.search > .ic { position: absolute; inset-inline-start: 12px; color: var(--ink-3); }
.search .input { padding-inline-start: 2.5rem; border-radius: 999px; }
.grid.cards { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.grid.products { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.grid.pools { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
.grid.ways { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: .6rem; }
.grid.kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.level-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); }
.grid.badges { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: .55rem; }
.grid.groups, .grid.rooms, .grid.ai-grid, .grid.earn-grid { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.grid.prize3 { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem; }
.earn-tile { padding: 1rem; display: flex; flex-direction: column; gap: .45rem; }
.pcard { overflow: hidden; padding: 0; }
.pcard .pimg { border-radius: 0; }
.product-top { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 1rem; align-items: start; }
.big-plate { width: 60px; height: 60px; border-radius: 18px; }
.big-plate .ic { width: 28px; height: 28px; }
.tickbox { width: 28px; height: 28px; border-radius: 9px; border: 2px solid var(--line); display: grid; place-items: center; flex-shrink: 0; background: var(--surface); }
.tickbox.on { background: var(--cta); border-color: var(--edge-cta); box-shadow: 0 2px 0 var(--edge-cta); }
.tickbox .ic { width: 16px; height: 16px; stroke-width: 3; }
.para { display: block; width: 100%; text-align: left; padding: .5rem .65rem; border-radius: 12px; margin-bottom: .35rem; line-height: 1.6; position: relative; font-size: 1rem; }
.para:active { background: rgb(23 46 91 / .05); }
.para.hl { background: rgb(138 255 107 / .35); box-shadow: inset 4px 0 0 var(--edge-cta); }
.cursor-tag { position: absolute; top: -9px; right: 10px; font-size: .68rem; color: #fff; padding: 0 .4rem; border-radius: 6px; font-weight: 800; font-family: Cairo, system-ui; }
.podium { display: flex; align-items: flex-end; gap: .6rem; justify-content: center; margin: .4rem 0; }
.pod { display: flex; flex-direction: column; align-items: center; gap: .2rem; }
.pod .block { width: 72px; border-radius: 12px 12px 4px 4px; display: grid; place-items: center; font-weight: 900; font-size: 1.3rem; color: var(--on-cta); border: 2px solid var(--line); }
.pod.p1 .block { height: 86px; background: var(--cta); border-color: var(--edge-cta); }
.pod.p2 .block { height: 62px; background: #e4ebf5; }
.pod.p3 .block { height: 46px; background: var(--done-line); }
.bracket-wrap { overflow-x: auto; padding-bottom: 6px; }
.week-wrap { overflow-x: auto; }
.week { min-width: 620px; }
.paper .ln.affected { background: rgb(242 139 20 / .14); }
.paper .ln.affected .mk { background: var(--done); }
.radar { width: 100%; max-width: 260px; height: auto; }
.round-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; width: 58px; height: 58px; border-radius: 18px; background: rgb(255 255 255 / .94); border: 2px solid var(--line); box-shadow: 0 3px 0 var(--edge-tile); font-size: .7rem; font-weight: 800; transition: translate 180ms var(--ease-spring), box-shadow 180ms; }
.round-btn:active { translate: 0 3px; box-shadow: none; }
.tier-mini svg { width: 28px; height: 28px; display: block; }
.hud.ts { top: 12px; inset-inline-start: 12px; }
.hud.te { top: 12px; inset-inline-end: 12px; }
.hud.te2 { top: 64px; inset-inline-end: 12px; }
.hud.bs { bottom: 12px; inset-inline-start: 12px; }
.hud.be { bottom: 16px; inset-inline-end: 12px; }
.pill.gems { gap: .55rem; padding: 0 .7rem; min-height: 34px; font-size: .85rem; }
.town-wrap.has-sel .hud.be, .town-wrap.has-sel .hud.te2 { display: none; }
.bpanel { top: 12px; bottom: 12px; inset-inline-end: 12px; width: min(330px, 46%); }
.town-wrap.has-sel .hud.te { inset-inline-end: calc(min(330px, 46%) + 24px); }
.earn-cta { padding: 0 1.4rem; }
.pay .row { min-height: 64px; }
.viewer-stage { min-height: 300px; height: 100%; }
.app.full .toasts { top: auto; bottom: 18px; }
.btn, .icon-btn, .pill, .round-btn, .dialog, .panel, .tile, .chip { color: var(--ink); }
.hero-deep .panel, .hero-deep .btn { color: var(--ink); }
.adplayer .bar { background: rgb(255 255 255 / .16); }
.para sup, .opt sup, h2 sup { font-size: .7em; }

/* ==========================================================================
   Landscape phone shell. Root 13px: every rem in the core reads phone-sized.
   Desktop: a framed 844×390 landscape phone + a flow index beside it.
   Real phone held sideways: the frame goes, the app fills the screen and the
   safe areas come from env(). Held upright: a "turn your phone" card.
   ========================================================================== */
html { font-size: 13px; }
body { min-height: 100dvh; background: #0d1f2e; background-image: radial-gradient(900px 500px at 80% 0%, rgb(4 145 165 / .35), transparent 60%), radial-gradient(800px 500px at 0% 100%, rgb(138 255 107 / .12), transparent 60%); color: var(--ink); }
.stage { min-height: 100dvh; display: grid; grid-template-columns: 1fr auto; align-items: center; justify-items: center; gap: 28px; padding: 28px; }
.flows { width: 270px; max-height: calc(100dvh - 56px); overflow: auto; background: rgb(255 255 255 / .06); border: 1px solid rgb(255 255 255 / .1); border-radius: 20px; padding: 14px; color: #fff; font-size: 13px; }
.flows h1 { font-size: 15px; margin-bottom: 2px; } .flows p { color: rgb(255 255 255 / .65); font-size: 12px; margin-bottom: 10px; }
.flows h2 { font-size: 11px; color: var(--cta); margin: 12px 0 4px; font-weight: 800; }
.flows a { display: flex; align-items: center; gap: 6px; color: #fff; text-decoration: none; padding: 6px 8px; border-radius: 9px; min-height: 32px; }
.flows a:hover { background: rgb(255 255 255 / .08); }
.flows a .ic { width: 15px; height: 15px; color: var(--cta); }
.flows .devbar { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.flows .devbar button { color: #fff; border: 1px solid rgb(255 255 255 / .2); border-radius: 999px; padding: 4px 10px; font-size: 12px; min-height: 32px; }
.flows .devbar button[aria-pressed="true"] { background: var(--cta); color: var(--on-cta); border-color: var(--cta); font-weight: 800; }
.devcol { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.device { --bez: 14px; padding: var(--bez); border-radius: 58px; background: #0b0f14; box-shadow: 0 0 0 2px #2a3340, 0 30px 80px -20px rgb(0 0 0 / .7); position: relative; }
.device::before { /* side buttons */ content: ""; position: absolute; top: -4px; inset-inline-start: 120px; width: 60px; height: 4px; border-radius: 4px 4px 0 0; background: #2a3340; }
.screen { width: 844px; height: 390px; border-radius: 46px; overflow: hidden; position: relative; background: var(--surface); }
.device[data-plat="ios"] .cam { position: absolute; top: 50%; translate: 0 -50%; inset-inline-start: 10px; width: 34px; height: 124px; border-radius: 20px; background: #000; z-index: 200; }
.device[data-plat="android"] { border-radius: 40px; }
.device[data-plat="android"] .screen { border-radius: 30px; }
.device[data-plat="android"] .cam { position: absolute; top: 50%; translate: 0 -50%; inset-inline-start: 16px; width: 14px; height: 14px; border-radius: 99px; background: #000; z-index: 200; box-shadow: 0 0 0 3px #111; }
.home-ind { position: absolute; bottom: 6px; left: 50%; translate: -50% 0; width: 150px; height: 5px; border-radius: 9px; background: rgb(23 46 91 / .35); z-index: 200; pointer-events: none; }
.devcaption { color: rgb(255 255 255 / .7); font-size: 12px; }
/* simulated safe areas inside the frame (iOS landscape: 47 each side, 21 bottom) */
.app { --sl: 47px; --sr: 47px; --sb: 21px; position: absolute; inset: 0; display: flex; background: var(--surface); background-image: var(--canvas); }
.device[data-plat="android"] .app { --sl: 0px; --sr: 34px; --sb: 12px; }

/* rail — navigation rail on the start edge (Material's pattern for landscape); right thumb */

.rail button { width: 66px; min-height: 52px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 10.5px; font-weight: 700; color: var(--ink-2); position: relative; }
.rail button .ic { width: 22px; height: 22px; stroke-width: 1.9; }
.rail button[aria-current="page"] { color: var(--brand-text); font-weight: 800; }
.rail button[aria-current="page"] .ic-wrap { background: rgb(4 145 165 / .14); }
.rail .ic-wrap { width: 48px; height: 28px; border-radius: 999px; display: grid; place-items: center; transition: background 200ms; }
.rail button.game .ic-wrap { background: var(--cta); box-shadow: 0 3px 0 var(--edge-cta); color: var(--on-cta); }
.rail button.game { color: var(--ink); }
.rail button:active .ic-wrap { translate: 0 2px; }
.content { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-inline-end: var(--sl); position: relative; }
.top { height: 50px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 10px; }
.top h1 { font-size: 1.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .back { display: inline-flex; align-items: center; gap: 0; min-height: 44px; padding-inline-end: 8px; color: var(--brand-text); font-weight: 700; border-radius: 999px; }
.top .back .ic { width: 26px; height: 26px; }
.top .pill { min-height: 36px; font-size: .95rem; }
.top .icon-btn { width: 40px; height: 40px; }
#view { flex: 1; min-height: 0; position: relative; padding-bottom: var(--sb); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 272px; gap: 10px; height: 100%; padding: 0 10px 8px; }
.pane { overflow: auto; min-height: 0; overscroll-behavior: contain; scrollbar-width: thin; padding: 2px 2px 10px; }
.single { height: 100%; overflow: auto; padding: 0 10px 10px; }
.split.viewer .main, .split.cam-split .main { display: flex; flex-direction: column; }
.viewer-stage { min-height: 0; flex: 1; }
.viewfinder.cam { flex: 1; min-height: 0; padding: 30px 60px; }
.cam-paper { width: 100%; max-width: 440px; transform: rotate(-1.5deg); }
.panel { border-radius: 20px; padding: .85rem; }
.panel > header { margin-bottom: .55rem; min-height: 32px; }
.panel > header h2 { font-size: 1.05rem; }
.hero-deep { border-radius: 20px; padding: .9rem 1rem; }
.chipglyph { width: 32px; height: 32px; } .chipglyph .ic { width: 17px; height: 17px; }
.grid.cards { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: .7rem; }
.grid.products { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .7rem; }
.grid.kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .6rem; }
.grid.level-grid { grid-template-columns: 1fr 1.2fr; gap: .7rem; }
.product-top .pimg { min-height: 170px !important; }
.pcard .pimg { aspect-ratio: 16/9; }
.pcard .pimg svg.book { width: 30%; }
.wday { min-height: 92px; }
.dialog { max-width: 480px; padding: 1rem 1.1rem; border-radius: 22px; max-height: calc(100% - 8px); }
.scrim { padding: 8px 60px; }
.toasts { top: 8px; }

/* immersive screens (town, ad): no rail, no header */
.app.full .rail, .app.full .top { display: none; }
.app.full .content { padding: 0; }
.app.full #view { padding: 0; }
.town-page, .town-wrap { height: 100%; }
.app.full .hud.ts, .app.full .hud.bs { inset-inline-start: calc(var(--sr) + 10px); }
.app.full .hud.te, .app.full .hud.te2, .app.full .hud.be { inset-inline-end: calc(var(--sl) + 10px); }
.app.full .hud.bs, .app.full .hud.be { bottom: calc(var(--sb) + 6px); }

function fmtLeft(ms) {

  const p = (x) => String(x).padStart(2, "0");

}

const hashOf = (x) => "#/" + x.r + (x.p != null ? "/" + encodeURIComponent(x.p) : "");

function setHash(x, push) { try { push ? history.pushState(null, "", hashOf(x)) : history.replaceState(null, "", hashOf(x)); } catch (e) {} }
function go(route, param) { STACK.push(ROUTE); ROUTE = { r: route, p: param }; setHash(ROUTE, true); render(false); }

function current() { return ROUTE; }
function later(fn, ms) { const t = setTimeout(fn, ms); timers.push(t); return t; }
function every(fn, ms) { const t = setInterval(fn, ms); timers.push(t); return t; }

function burst(target) {
  const app = $("#app"); if (!target || !app) return;
  const a = app.getBoundingClientRect(), b = target.getBoundingClientRect();
  const el = document.createElement("div"); el.className = "burst";
  const sx = a.width / app.offsetWidth || 1;
  el.style.left = (b.left + b.width / 2 - a.left) / sx + "px"; el.style.top = (b.top + b.height / 2 - a.top) / sx + "px";
  const cols = ["#8aff6b", "#0491a5", "#f9b86c", "#7b4ddb", "#172e5b", "#8eb1ff"];

  const a = e.target.closest("[data-act]");
  if (a) { e.preventDefault(); const fn = ACT[a.dataset.act]; if (fn) fn(a, e); else console.warn("no action", a.dataset.act); }
});
document.addEventListener("submit", (e) => {
  const f = e.target.closest("form[data-submit]"); if (!f) return; e.preventDefault();

});

function tree(x, y, s = 1, c = "#3f9a5c") { return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-4" y="-16" width="8" height="18" rx="3" fill="#8a5a2b" ${OL}/><circle cy="-30" r="20" fill="${c}" ${OL}/><circle cx="-6" cy="-36" r="6" fill="#fff" opacity=".25"/></g>`; }

/* cost to reach the next level — display values only, no real engine */
function upCost(b) {
  const next = b.lvl + 1;
  if (b.pool === "gen") return { gen: b.id === "dar" ? 150 * next + 150 : b.id === "arena" ? 300 : 150 * next };
  return { gen: 80 * next, [b.pool]: 100 * next };
}
function upState(b) {
  const dar = bld("dar");
  if (b.needDar && dar.lvl < b.needDar) return { kind: "gate", msg: `تتفتح كي توصل دار وائل للمستوى ${b.needDar}` };
  if (b.lvl >= b.max) return { kind: "max" };
  if (b.id !== "dar" && b.lvl + 1 > dar.lvl && !b.needDar) return { kind: "cap", msg: `طوّر دار وائل للمستوى ${b.lvl + 1} قبل` };
  const cost = upCost(b), miss = Object.entries(cost).filter(([k, v]) => S.points[k] < v).map(([k, v]) => [k, v - S.points[k]]);
  return miss.length ? { kind: "miss", cost, miss } : { kind: "ok", cost };
}

        <g transform="translate(0 ${-h - 34})"><rect x="-50" y="-9" width="100" height="18" rx="9" fill="#fff" ${OL}/><rect class="bprog" x="-46" y="-5" width="0" height="10" rx="5" fill="#8aff6b"/></g></g>

      ${st.kind === "ok" && S.building !== id ? `<g class="up" transform="translate(24 ${-h - 18})"><circle r="13" fill="#8aff6b" stroke="#5bcd3f" stroke-width="3"/><path d="M0 6V-6M-5 -1l5-5 5 5" stroke="#172e5b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>` : ""}

    <path d="M150 210C170 120 330 95 470 110C640 90 840 100 900 200C960 300 950 470 860 540C760 610 300 620 170 545C90 490 120 300 150 210z" fill="#d4f7c4" ${OL}/>
    <g fill="none" stroke-linecap="round"><path d="M500 310L290 250M500 310L720 240M500 310L300 465M500 310L700 470M500 310L505 530M500 310L870 390" stroke="#bfe3ad" stroke-width="34"/>
    <path d="M500 310L290 250M500 310L720 240M500 310L300 465M500 310L700 470M500 310L505 530M500 310L870 390" stroke="#f3f9ee" stroke-width="26"/></g>

/* the contextual building panel — shared by both layouts */
function buildingPanel(id) {
  const b = bld(id), st = upState(b), cost = upCost(b), building = S.building === id;

    return `<div class="need">${gem(k)}<div class="col" style="gap:.2rem"><div class="row small"><b>${POOLS[k].label}</b><span class="ms-auto ${ok ? "" : "muted"}">${n(Math.min(have, v))} / ${n(v)}</span></div>${bar(have / v, ok ? "" : "brand")}</div>${ok ? `<span class="tag lime">${I("check", "s")}</span>` : `<span class="tag">ناقص ${n(v - have)}</span>`}</div>`; }).join("");
  let foot;
  if (building) foot = `<div class="col"><div class="row small b">${I("hourglass")} نبنيو المستوى ${b.lvl + 1}…</div>${bar(0)}<p class="tiny">في التطبيق الحقيقي تاخو وقت؛ هنا مسرّعة للعرض.</p></div>`;
  else if (st.kind === "ok") foot = `<button class="cta block lg" data-act="upgrade" data-b="${id}">${I("up")} طوّر للمستوى ${b.lvl + 1}</button>`;
  else if (st.kind === "miss") foot = `<button class="cta block" aria-disabled="true" data-act="lockedUp" data-b="${id}">${I("lock")} ناقصك ${st.miss.map(([k, v]) => `${n(v)} ${POOLS[k].short}`).join(" و ")}</button><button class="btn block" style="margin-top:.6rem" data-go="points">${I("zap")} كيفاش نربح ${POOLS[st.miss[0][0]].label}؟</button>`;

  else foot = `<div class="stamp cta">أعلى مستوى</div>`;
  return `<div class="bp-body" data-scroll="bp">
      <div class="row"><div class="grow"><div class="kicker">${b.lvl ? `المستوى ${n(b.lvl)} من ${n(b.max)}` : "مسكّرة"}</div><h3 style="font-size:1.25rem">${b.name}</h3></div><button class="icon-btn flat" data-act="pickB" data-b="" aria-label="سكّر">${I("x")}</button></div>
      <p class="small muted">${b.desc}</p>
      ${b.lvl < b.max && st.kind !== "gate" ? `<div class="lbl">باش توصل للمستوى ${n(b.lvl + 1)} تحتاج:</div>${needRows}` : ""}

      ${b.pool !== "gen" ? `<p class="tiny">${gem(b.pool)} ${POOLS[b.pool].label} تجي من تمارين، فيديوهات وحصص المادّة هاذي برك.</p>` : ""}
    </div><div class="bp-foot">${foot}</div>`;
}

ACT.pickB = (el) => { const id = el.dataset.b; (UI.town ||= {}).sel = id || null;

ACT.lockedUp = (el) => { shake(el); const st = upState(bld(el.dataset.b)); toast(st.msg || "ناقصك نقاط — كمّل تمارين وفيديوهات", "lock"); };
ACT.upgrade = (el) => {
  const b = bld(el.dataset.b), cost = upCost(b);
  Object.entries(cost).forEach(([k, v]) => (S.points[k] -= v));
  S.building = b.id; refresh();
  let t = 0; const iv = setInterval(() => { t += 5; const prog = $(`.bld[data-b="${b.id}"] .bprog`), fill = $(".bp-foot .bar > i");
    if (prog) prog.setAttribute("width", (92 * t) / 100); if (fill) fill.style.width = t + "%";

  const main = `<div class="sec-title"><h3>مجموعاتي</h3><button class="cta sm ms-auto" data-go="group-new">${I("plus")} اعمل مجموعة</button></div>
    ${S.groups.length ? `<div class="grid groups">${S.groups.map((g) => `<button class="tile" data-go="group" data-p="${g.id}" style="padding:.85rem"><div class="row"><span class="plate" style="background:${SUBJ[g.subj].c}">${I("users")}</span><div class="grow"><div class="b">${g.name}</div><div class="tiny">${g.members.length} أعضاء · ${SUBJ[g.subj].ar}</div></div>${g.unread ? `<span class="tag brand">${g.unread}</span>` : ""}</div>
      <div class="row" style="margin-top:.6rem"><div class="avs">${g.members.slice(0, 5).map((m) => av(m, "sm")).join("")}</div>${g.live ? `<span class="tag live ms-auto"><span class="live-dot"></span> ${g.live === "challenge" ? "تحدّي مباشر" : "يقراو توّا"}</span>` : ""}</div></button>`).join("")}</div>`
    : emptyBox("users", "ما عندك حتّى مجموعة", "اعمل مجموعة مع صحابك ولا ادخل لمجموعة مفتوحة.", `<button class="cta" data-go="group-new">اعمل مجموعة</button>`)}
    <div class="sec-title" style="margin-top:1rem"><h3>مجموعات مفتوحة</h3></div>
    <div class="panel" style="padding:.3rem 1rem"><div class="list">${S.discover.map((d) => `<div class="li"><span class="plate" style="background:${SUBJ[d.subj].c}">${I("users")}</span><div class="grow"><div class="b small ltr" style="text-align:right">${d.name}</div><div class="tiny">${d.n} عضو</div></div><button class="btn sm" data-act="joinGroup" data-id="${d.id}">ادخل</button></div>`).join("")}</div></div>`;
  const side = `<div class="panel"><header><span class="chipglyph" style="background:var(--done)">${I("trophy")}</span><h2>الأحداث</h2></header><div class="list">${S.events.filter((e) => e.state !== "done").slice(0, 3).map((e) => `<button class="li" data-go="event" data-p="${e.id}"><div class="grow"><div class="b small">${e.t}</div><div class="tiny">${e.when}</div></div><span class="money small">${COIN}${n(e.prize)}</span></button>`).join("")}</div><button class="btn sm block" data-go="events" style="margin-top:.5rem">الأحداث الكل</button></div>`;
  return { title: "المجتمع", back: "home", html: split(main, side) };
};
ACT.joinGroup = (el) => { const d = S.discover.find((x) => x.id === el.dataset.id); S.discover = S.discover.filter((x) => x !== d);
  S.groups.push({ id: "g-" + d.id, name: d.name, members: ["me", "ines", "aziz", "oussama"], live: null, subj: d.subj, unread: 0 }); refresh(); toast(`دخلت «${d.name}»`, "users"); };
R["group-new"] = () => {
  const u = (UI.gnew ||= { name: "", subj: "math", priv: "private", inv: ["yas", "amine"] });
  const friends = ["yas", "amine", "sara", "youssef", "mariem", "nour"];
  const main = `<form data-submit="groupCreate" class="panel col" style="gap:.9rem"><div class="field"><label for="gn">إسم المجموعة</label><input id="gn" class="input" placeholder="مثلاً: نراجعو الأعداد المركّبة" value="${esc(u.name)}" oninput="UI.gnew.name=this.value" maxlength="40"></div>
    <div class="field"><span class="lbl">المادّة</span><div class="chips">${Object.entries(SUBJ).map(([k, s]) => `<button type="button" class="chip" aria-pressed="${u.subj === k}" data-act="gPick" data-k="subj" data-v="${k}">${s.ar}</button>`).join("")}</div></div>
    <div class="field"><span class="lbl">شكون ينجم يدخل؟</span><div class="seg">${[["private", "بالدعوة برك"], ["open", "مفتوحة للكل"]].map(([v, l]) => `<button type="button" class="chip" aria-pressed="${u.priv === v}" data-act="gPick" data-k="priv" data-v="${v}">${l}</button>`).join("")}</div></div>
    <div class="field"><span class="lbl">ادعي صحابك</span><div class="chips">${friends.map((f) => `<button type="button" class="chip" aria-pressed="${u.inv.includes(f)}" data-act="gInv" data-v="${f}">${av(f, "sm")} ${pname(f).split(" ")[0]}</button>`).join("")}</div></div>
    <button class="cta lg" type="submit">${I("check")} اعمل المجموعة</button></form>`;
  const side = `<div class="panel col" style="gap:.6rem"><div class="kicker">معاينة</div><div class="row"><span class="plate" style="background:${SUBJ[u.subj].c}">${I("users")}</span><div><div class="b">${esc(u.name) || "إسم المجموعة"}</div><div class="tiny">${u.inv.length + 1} أعضاء · ${u.priv === "open" ? "مفتوحة" : "بالدعوة"}</div></div></div><div class="avs">${["me", ...u.inv].map((m) => av(m, "sm")).join("")}</div></div>`;
  return { title: "مجموعة جديدة", back: "community", html: split(main, side) };
};
ACT.gPick = (el) => { UI.gnew[el.dataset.k] = el.dataset.v; refresh(); };
ACT.gInv = (el) => { const a = UI.gnew.inv, v = el.dataset.v; UI.gnew.inv = a.includes(v) ? a.filter((x) => x !== v) : [...a, v]; refresh(); };
ACT.groupCreate = (f) => { const u = UI.gnew; if (!u.name.trim()) { shake($("#gn")); $("#gn").focus(); return toast("عطيها إسم", "edit"); }
  const id = crypto.randomUUID ? crypto.randomUUID() : "g" + Date.now(); S.groups.unshift({ id, name: u.name.trim(), members: ["me", ...u.inv], live: null, subj: u.subj, unread: 0 }); UI.gnew = null;
  go("group", id); setTimeout(() => toast("المجموعة تعملت — بعثنا الدعوات", "users"), 100); };

const CHAT0 = { "g-math": [["yas", "شكون حلّ تمرين 4 من السلسلة؟"], ["amine", "أنا، أما الجزء ب مازلت"], ["sara", "نعملو تحدّي الليلة؟"], ["sys", "ياسمين بدات تحدّي مباشر"]], "g-phys": [["mariem", "نكمّلو درس الـ RC من الصفحة 3"], ["skander", "باهي، أنا داخل"]], default: [["sys", "المجموعة تعملت"]] };
const chatBox = (gid) => { const msgs = (S.chat ||= {})[gid] ||= (CHAT0[gid] || CHAT0.default).map(([w, t]) => ({ w, t }));
  return `<div class="panel chat" style="padding:.7rem"><header style="margin-bottom:.4rem;min-height:0"><h2 style="font-size:1rem">${I("msg")} الشات</h2></header><div class="msgs" data-scroll="chat" id="msgs">${msgs.map(msgHtml).join("")}</div>
    <form data-submit="chatSend" data-g="${gid}"><input class="input" name="m" placeholder="اكتب…" autocomplete="off" style="min-height:44px"><button class="icon-btn" type="submit" aria-label="ابعث" style="background:var(--cta);border-color:var(--edge-cta)">${I("send", "flip")}</button></form></div>`; };
const msgHtml = (m) => m.w === "sys" ? `<div class="msg sys"><div class="bub">${m.t}</div></div>` : `<div class="msg ${m.w === "me" ? "me" : ""}">${m.w === "me" ? "" : av(m.w, "sm")}<div><div class="who">${m.w === "me" ? "" : pname(m.w).split(" ")[0]}</div><div class="bub">${esc(m.t)}</div></div></div>`;
function pushMsg(gid, w, t) { (S.chat[gid] ||= []).push({ w, t }); const box = $("#msgs"); if (box) { box.insertAdjacentHTML("beforeend", msgHtml({ w, t })); box.scrollTop = box.scrollHeight; } }
ACT.chatSend = (f) => { const v = f.m.value.trim(); if (!v) return; pushMsg(f.dataset.g, "me", v); f.m.value = "";
  setTimeout(() => pushMsg(f.dataset.g, group(f.dataset.g)?.members[1] || "yas", ["👍 باهي", "صحيح", "نعم، كيف كيف", "يعيشك"][Math.floor(Math.random() * 4)].replace("👍 ", "")), 1400); };

R.group = (id) => {
  const g = group(id) || S.groups[0];
  const main = `<div class="panel"><div class="row wrap"><span class="plate" style="background:${SUBJ[g.subj].c};width:52px;height:52px;border-radius:16px">${I("users", "l")}</span><div class="grow"><h2>${esc(g.name)}</h2><div class="tiny">${g.members.length} أعضاء · ${SUBJ[g.subj].ar}</div></div><div class="avs">${g.members.slice(0, 6).map((m) => av(m, "sm")).join("")}</div><button class="btn sm" data-act="invite">${I("plus")} ادعي</button><button class="icon-btn flat" data-act="groupMore" data-id="${g.id}" aria-label="خيارات">${I("more")}</button></div></div>
    <div class="grid rooms" style="margin-top:.9rem">
      <button class="tile room" data-go="challenge" data-p="${g.id}" style="padding:1rem"><div class="row"><span class="plate" style="background:var(--live)">${I("zap")}</span><div class="grow"><div class="b">تحدّي مباشر</div><div class="tiny">أسئلة بالوقت، الكل يجاوب، الترتيب في الآخر</div></div></div><div class="row" style="margin-top:.7rem">${g.live === "challenge" ? `<span class="tag live"><span class="live-dot"></span> 3 داخلين توّا</span><span class="cta sm ms-auto" style="pointer-events:none">ادخل</span>` : `<span class="tag">+5 لـ +30 نقطة</span><span class="cta sm ms-auto" style="pointer-events:none">ابدا تحدّي</span>`}</div></button>
      <button class="tile room" data-go="read" data-p="${g.id}" style="padding:1rem"><div class="row"><span class="plate" style="background:var(--brand)">${I("book")}</span><div class="grow"><div class="b">نقراو مع بعضنا</div><div class="tiny">نفس الدرس، نفس الصفحة، والشات بجنبكم</div></div></div><div class="row" style="margin-top:.7rem">${g.live === "read" ? `<span class="tag live"><span class="live-dot"></span> مريم وإسكندر يقراو</span>` : `<span class="tag">اختار درس</span>`}<span class="btn sm ms-auto" style="pointer-events:none">ادخل للغرفة</span></div></button></div>`;
  return { title: "المجموعة", back: "community", html: split(main, chatBox(g.id), "chatside"), mount: () => { const b = $("#msgs"); if (b) b.scrollTop = b.scrollHeight; } };
};
ACT.invite = () => { try { navigator.clipboard.writeText("https://wael.tn/g/join/7KQ2"); } catch (e) {} toast("رابط الدعوة تنسخ", "link"); };
ACT.groupMore = (el) => dialog(`<h3>خيارات المجموعة</h3><div class="list"><button class="li" data-act="soon" data-msg="التنبيهات تسكّرت للمجموعة هاذي">${I("bell")} سكّر التنبيهات</button><button class="li" data-act="soon" data-msg="تبديل الإسم — قريب">${I("edit")} بدّل الإسم</button><button class="li" data-act="leaveGroup" data-id="${el.dataset.id}" style="color:var(--live-strong)">${I("logout")} اخرج من المجموعة</button></div>`);
ACT.leaveGroup = (el) => dialog(`<h3>تخرج من المجموعة؟</h3><p class="small muted">تنجم ترجع كان يدعيوك من جديد.</p><div class="dialog-actions"><button class="btn" data-close>لا</button><button class="btn-live" data-act="leaveOk" data-id="${el.dataset.id}">اخرج</button></div>`);
ACT.leaveOk = (el) => { S.groups = S.groups.filter((g) => g.id !== el.dataset.id); closeDialog(); go("community"); toast("خرجت من المجموعة", "logout"); };

/* ---------- التحدّي المباشر ---------- */
const CHQ = [
  { q: "Unité de la période T d'un signal ?", o: ["s", "Hz", "m", "m/s"], a: 0, ex: "T بالثانية؛ التواتر N = 1/T بالـ Hz." },
  { q: "Dans un dipôle RC, la constante de temps τ = ?", o: ["R·C", "R/C", "C/R", "1/(R·C)"], a: 0, ex: "τ = R·C، وتتقاس بالثانية." },
  { q: "La célérité d'une onde mécanique dépend :", o: ["du milieu", "de l'amplitude", "de la source", "de la durée"], a: 0, ex: "السرعة تتبدّل بالوسط برك، موش بالمصدر." },
];
const OPTC = ["var(--live)", "var(--brand)", "var(--done)", "var(--violet)"];
R.challenge = (gid) => {
  const g = group(gid) || S.groups[0];
  const u = (UI.ch && UI.ch.g === g.id) ? UI.ch : (UI.ch = { g: g.id, phase: "lobby", qi: 0, pick: null, score: { me: 0, yas: 0, amine: 0, sara: 0, youssef: 0, nour: 0 }, joined: 3, t: 15 });
  const players = ["me", "yas", "amine", "sara", "youssef", "nour"];
  let stage;
  if (u.phase === "lobby") stage = `<div class="panel col ch-stage" style="align-items:center;text-align:center;gap:.8rem"><span class="tag live"><span class="live-dot"></span> اللّوبي</span><h2>تحدّي فيزياء — 3 أسئلة</h2><p class="small muted">15 ثانية لكل سؤال. أسرع جواب صحيح ياخو نقاط أكثر.</p>
      <div class="avs" style="transform:scale(1.25);margin:.4rem 0">${players.slice(0, u.joined).map((m) => av(m)).join("")}</div><div class="tiny"><b class="num" id="joined">${u.joined}</b> / 6 داخلين</div>
      <button class="cta lg" data-act="chStart">${I("play")} ابدا</button></div>`;
  else if (u.phase === "final") { const rank = Object.entries(u.score).sort((a, b) => b[1] - a[1]), myPos = rank.findIndex((r) => r[0] === "me") + 1;
    stage = `<div class="panel col ch-stage" style="align-items:center;text-align:center;gap:.6rem"><div class="kicker">الترتيب النهائي</div>
      <div class="podium">${[1, 0, 2].map((i) => `<div class="pod p${i + 1}">${av(rank[i][0], i === 0 ? "lg" : "")}<b class="small">${rank[i][0] === "me" ? "أنت" : pname(rank[i][0]).split(" ")[0]}</b><div class="block">${i + 1}</div><span class="tiny num">${rank[i][1]}</span></div>`).join("")}</div>
      <h3 id="chResult">${myPos <= 3 ? `المرتبة ${myPos}!` : `المرتبة ${myPos}`} · ${pts("+" + [30, 20, 15, 10, 5, 5][myPos - 1], "phys")}</h3>
      <div class="row"><button class="btn" data-go="group" data-p="${g.id}">رجوع للمجموعة</button><button class="cta" data-act="chAgain">${I("refresh")} عاود</button></div></div>`; }
  else { const q = CHQ[u.qi], rev = u.phase === "reveal";
    const right = rev ? players.filter((p) => (p === "me" ? u.pick === q.a : u.ans[p] === q.a)) : [];
    stage = `<div class="panel col ch-stage" style="gap:.7rem"><div class="row"><span class="tag">سؤال ${u.qi + 1} / ${CHQ.length}</span><span class="tiny ms-auto">${rev ? "" : u.phase === "wait" ? `جاوبو <b class="num" id="answered">${u.answered}</b> / 6` : ""}</span>${rev ? "" : ring(u.t / 15, 52, 6, `<b class="num" id="chT">${u.t}</b>`)}</div>
      <h2 class="ltr" style="text-align:right;font-size:1.25rem">${q.q}</h2>
      <div class="opts">${q.o.map((o, i) => { const st = rev ? (i === q.a ? "right" : i === u.pick ? "wrong" : "dim") : u.pick === i ? "picked" : u.pick != null ? "dim" : "";
        return `<button class="tile opt" data-state="${st}" data-act="chPick" data-i="${i}"><span class="k" style="background:${OPTC[i]}">${"ABCD"[i]}</span><span class="ltr">${o}</span>${rev && i === q.a ? `<span class="ms-auto">${I("check")}</span>` : ""}</button>`; }).join("")}</div>
      ${rev ? `<div class="row wrap" style="gap:.5rem"><span class="small b">جاوبو صحيح:</span><div class="avs">${right.map((p) => av(p, "sm")).join("") || '<span class="tiny">حتّى حد</span>'}</div><span class="tiny grow">${q.ex}</span><button class="cta" data-act="chNext">${u.qi + 1 < CHQ.length ? "السؤال الجاي" : "الترتيب"} ${I("chevL")}</button></div>` : u.phase === "wait" ? `<p class="small muted">${I("check", "s")} جاوبت — نستنّاو البقية…</p>` : ""}</div>`; }
  const scoreBar = `<div class="row wrap ch-scores" style="gap:.4rem;margin-bottom:.6rem">${Object.entries(u.score).sort((a, b) => b[1] - a[1]).map(([p, s]) => `<span class="tag ${p === "me" ? "lime" : ""}">${p === "me" ? "أنت" : pname(p).split(" ")[0]} <bdi class="num">${s}</bdi></span>`).join("")}</div>`;
  return { title: "تحدّي مباشر", back: "group", html: split(scoreBar + stage, chatBox(g.id), "chatside"), mount: () => {
    const b = $("#msgs"); if (b) b.scrollTop = b.scrollHeight;
    if (u.phase === "lobby" && u.joined < 6) every(() => { if (u.joined < 6) { u.joined++; refresh(); if (u.joined === 5) pushMsg(g.id, "youssef", "داخل!"); } }, 1300);
    if (u.phase === "q") every(() => { u.t--; const e = $("#chT"); if (e) e.textContent = u.t; const f = $(".ch-stage .ring .fil"); if (f) { const c = f.getAttribute("stroke-dasharray"); f.setAttribute("stroke-dashoffset", c * (1 - u.t / 15)); }
      if (u.t <= 0) { u.pick = u.pick ?? -1; toWait(u); } }, 1000);
    if (u.phase === "wait") every(() => { u.answered = Math.min(6, u.answered + 1); const e = $("#answered"); if (e) e.textContent = u.answered; if (u.answered >= 6) { u.phase = "reveal"; scoreRound(u); refresh(); } }, 600);
    if (u.phase === "final") { const r = $("#chResult"); r && burst(r); S.points.phys += 15; }
  } };
};
function toWait(u) { u.phase = "wait"; u.answered = 3; const q = CHQ[u.qi]; u.ans = { yas: q.a, amine: u.qi === 1 ? 2 : q.a, sara: u.qi === 0 ? 1 : q.a, youssef: 3, nour: u.qi === 2 ? q.a : 1 }; refresh(); }
function scoreRound(u) { const q = CHQ[u.qi]; Object.keys(u.score).forEach((p) => { const ok = p === "me" ? u.pick === q.a : u.ans[p] === q.a; if (ok) u.score[p] += p === "me" ? 100 + u.t * 10 : 100 + Math.floor(Math.random() * 120); }); }
ACT.chStart = () => { const u = UI.ch; u.phase = "q"; u.t = 15; u.pick = null; refresh(); pushMsg(u.g, "sys", "التحدّي بدا — بالتوفيق"); };
ACT.chPick = (el) => { const u = UI.ch; if (u.phase !== "q") return toast(u.phase === "reveal" ? "شوف الإجابة الصحيحة واضغط «الجاي»" : "جاوبت — نستنّاو البقية", "clock"); u.pick = +el.dataset.i; toWait(u); };
ACT.chNext = () => { const u = UI.ch; if (u.qi + 1 < CHQ.length) { u.qi++; u.phase = "q"; u.t = 15; u.pick = null; } else u.phase = "final"; refresh(); };
ACT.chAgain = () => { UI.ch = null; refresh(); };

/* ---------- نقراو مع بعضنا ---------- */
R.read = (gid) => {
  const g = group(gid) || S.groups[0], u = (UI.read ||= { page: 2, follow: true, hl: [] });
  const paras = [
    ["Forme exponentielle", "Tout nombre complexe non nul z de module r et d'argument θ s'écrit z = r·e^{iθ}."],
    ["Propriété", "Pour tous réels θ et θ′ : e^{iθ} × e^{iθ′} = e^{i(θ+θ′)}."],
    ["Formule de Moivre", "(cos θ + i sin θ)ⁿ = cos(nθ) + i sin(nθ), pour tout entier n."],
    ["Exemple", "z = 1 + i√3 : |z| = 2 et arg(z) = π/3, donc z = 2e^{iπ/3} et z⁶ = 64."],
  ];
  const main = `<div class="panel read-doc"><div class="row" style="margin-bottom:.6rem"><span class="tag brand">${I("book", "s")} Nombres complexes — cours</span><span class="tiny ms-auto">صفحة ${u.page} / 6</span></div>
    <div class="row wrap" style="gap:.4rem;margin-bottom:.7rem"><span class="tag"><span class="av sm" style="background:${PEOPLE.mariem.c};width:20px;height:20px;font-size:.6rem">م</span> مريم · ص ${u.page}</span><span class="tag"><span class="av sm" style="background:${PEOPLE.skander.c};width:20px;height:20px;font-size:.6rem">إ</span> إسكندر · ص ${u.page}</span>
      <button class="chip ms-auto" aria-pressed="${u.follow}" data-act="readFollow">${I("eye", "s")} تبّع مريم</button></div>
    <div class="ltr" style="text-align:left">${paras.map(([h, t], i) => `<button class="para ${u.hl.includes(i) ? "hl" : ""}" data-act="readHl" data-i="${i}"><b>${h}.</b> ${sup(t)}${i === 1 ? `<span class="cursor-tag" style="background:${PEOPLE.mariem.c}">مريم</span>` : ""}</button>`).join("")}</div>
    <div class="row" style="margin-top:.8rem"><button class="btn sm" data-act="readPage" data-d="-1">${I("chevR")} السابقة</button><button class="btn sm" data-act="readHand">${I("hand")} عندي سؤال</button><button class="btn sm ms-auto" data-act="readPage" data-d="1">الجاية ${I("chevL")}</button></div></div>`;
  return { title: "نقراو مع بعضنا", back: "group", html: split(main, chatBox(g.id), "chatside"), mount: () => { const b = $("#msgs"); if (b) b.scrollTop = b.scrollHeight; } };
};
ACT.readHl = (el) => { const u = UI.read, i = +el.dataset.i; const had = u.hl.includes(i); u.hl = had ? u.hl.filter((x) => x !== i) : [...u.hl, i]; refresh(); if (!had) pushMsg(current().p || "g-phys", "sys", "علّمت سطر — يظهر للكل"); };
ACT.readFollow = () => { UI.read.follow = !UI.read.follow; refresh(); toast(UI.read.follow ? "تتبّع في صفحة مريم" : "تقرا على روحك", "eye"); };
ACT.readPage = (el) => { const u = UI.read; u.page = Math.max(1, Math.min(6, u.page + +el.dataset.d)); if (u.follow) { u.follow = false; toast("بطّلت تتبّع مريم — تقرا على روحك", "eye"); } refresh(); };

function radar(stats, size = 240) {
  const c = size / 2, r = size / 2 - 34, N = stats.length;
  const pt = (i, v) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / N; return [c + Math.cos(a) * r * v, c + Math.sin(a) * r * v]; };
  const ringP = (v) => stats.map((_, i) => pt(i, v).join(",")).join(" ");
  return `<svg viewBox="0 0 ${size} ${size}" class="radar" role="img" aria-label="المستوى حسب المادّة">${[.25, .5, .75, 1].map((v) => `<polygon points="${ringP(v)}" fill="none" stroke="rgb(23 46 91 / .12)" stroke-width="1.5"/>`).join("")}
    ${stats.map((_, i) => `<line x1="${c}" y1="${c}" x2="${pt(i, 1)[0]}" y2="${pt(i, 1)[1]}" stroke="rgb(23 46 91 / .1)"/>`).join("")}
    <polygon points="${stats.map((s, i) => pt(i, s.m / 100).join(",")).join(" ")}" fill="rgb(138 255 107 / .45)" stroke="#5bcd3f" stroke-width="3" stroke-linejoin="round"/>
    ${stats.map((s, i) => { const [x, y] = pt(i, s.m / 100), [lx, ly] = pt(i, 1.2); return `<circle cx="${x}" cy="${y}" r="4.5" fill="#172e5b"/><text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="800" fill="#172e5b" font-family="Cairo, system-ui">${SUBJ[s.s].ar.split(" ")[0]}</text>`; }).join("")}</svg>`;
}

  const main = `<div class="grid kpis">${[["clock", `${Math.floor(tot)}س ${Math.round((tot % 1) * 60)}د`, "وقت القراية هالجمعة"], ["calendar", "5 / 7", "أيام نشاط"], ["listc", ex, "تمارين"], ["target", "74٪", "معدّل الإجابات"]].map(([ic, v, k]) => `<div class="panel stat" style="padding:.8rem"><span class="row muted">${I(ic, "s")}</span><span class="v">${typeof v === "number" ? n(v) : `<bdi>${v}</bdi>`}</span><span class="k">${k}</span></div>`).join("")}</div>
    <div class="grid level-grid" style="margin-top:.9rem"><div class="panel col" style="align-items:center"><header style="align-self:stretch"><h2>مستواك حسب المادّة</h2></header>${radar(S.stats)}</div>
    <div class="panel"><header><h2>وقت القراية</h2><span class="tiny ms-auto">هالجمعة</span></header><div class="col" style="gap:.6rem">${S.stats.map((s) => `<div><div class="row small"><b>${SUBJ[s.s].ar}</b><span class="ms-auto tiny"><bdi>${s.h}</bdi>س · ${s.d} أيام · ${s.ex} تمرين</span></div><div class="bar thin"><i style="width:${(s.h / maxH) * 100}%;background:${SUBJ[s.s].c}"></i></div></div>`).join("")}</div></div></div>`;
  const side = `<div class="col" style="gap:.7rem"><div class="panel" style="border-color:var(--done-line)"><div class="row small b">${I("info")} الفيزياء هابطة شوية</div><p class="small muted" style="margin:.3rem 0 .5rem">يومين برك هالجمعة و6 تمارين. 20 دقيقة في النهار تكفي باش ترجع.</p><button class="btn sm" data-act="planPhys">${I("calendar")} زيد 20د للبرنامج</button></div>

    <div class="tiles">${tiles.map(([r, ic, c, t, s]) => `<button class="tile htile" data-go="${r}"><span class="plate" style="background:${c}">${I(ic)}</span><h3>${t}</h3><p class="tiny">${s}</p></button>`).join("")}</div>
    <div class="today"><div class="panel"><div class="row"><b>نهارك زين ${S.user.first}</b></div><div class="row" style="margin-top:.4rem">${ring(done / S.todos.length, 52, 7, `<b class="num small">${done}/${S.todos.length}</b>`)}<div class="grow"><div class="small b">مهام اليوم</div><div class="tiny">الجاية: ${(S.todos.find((t) => !t.done) || { t: "كمّلت الكل" }).t}</div></div></div><button class="btn sm block" style="margin-top:.5rem" data-go="goals">${I("listc")} المهام</button></div>
      <div class="panel"><div class="row">${COIN}<b class="num">${n(S.coins)}</b><span class="tiny">قطعة</span></div><button class="cta block" style="margin-top:.5rem" data-go="earn">${I("plus")} اربح قطع</button></div></div>
  </div>`;
  return { title: "الرئيسية", html };
};

/* the flow index beside the frame (desktop only) — every link drives the phone */
const FLOWS = [
  ["القطع", [["wallet", "المحفظة والحركة", "wallet"], ["content", "الدروس بالقطع (سوم + مدّة)", "book"], ["item:pdf-complexes", "شراء بالقطع ← تأكيد ← كرونو", "unlock"], ["item:vid-limites", "محتوى مفتوح + الوقت الباقي", "clock"], ["ad", "إعلان بمكافأة", "tv"], ["tasks", "المهام (استبيان، بروفيل، تقييم)", "listc"], ["referral", "استدعي صحابك", "share"]]],
  ["مكتبة وائل", [["store", "المنتوجات", "bag"], ["product:annales-math", "تفاصيل منتوج", "book"], ["cart", "القفّة", "cart"], ["checkout", "الطلب: عنوان ← دفع ← مراجعة", "truck"], ["orders", "طلباتي وتتبّع الطلب", "package"]]],
  ["وضع اللعب", [["town", "مدينتي (اضغط على بناية)", "castle"], ["points", "كيفاش تربح نقاط", "zap"], ["league", "الدوري، الشارات، المستوى", "trophy"]]],
  ["المجتمع", [["community", "مجموعاتي + مجموعات مفتوحة", "users"], ["group-new", "اعمل مجموعة", "plus"], ["challenge:g-math", "تحدّي مباشر + شات", "zap"], ["read:g-phys", "نقراو مع بعضنا", "book"], ["events", "الأحداث", "trophy"], ["event:ev-math", "حدث بالإقصائيات (الجدول)", "flag"]]],
  ["التوجيه", [["level", "مستوايا (رادار + وقت)", "chart"], ["recs", "مقترحة ليك «خاطر…»", "sparkles"], ["goals", "مهام، هدف، برنامج", "target"], ["focus", "مؤقّت التركيز", "timer"]]],
  ["الذكاء الاصطناعي", [["ai-photo", "صوّر الإجابة ← تحليل ← تصحيح", "camera"], ["ai-quiz", "ولّدلي كويز", "sparkles"]]],
];
$("#flows").innerHTML = `<h1>خريطة الفلوهات</h1><p>كل رابط يحلّ الشاشة في التلفون. الحالة تتعاود كي تعمل refresh.</p>
  ${FLOWS.map(([h, ls]) => `<h2>${h}</h2>${ls.map(([r, l, ic]) => { const [rt, p] = r.split(":"); return `<a href="#" data-act="flow" data-r="${rt}" ${p ? `data-pp="${p}"` : ""}>${I(ic)}${l}</a>`; }).join("")}`).join("")}
  <h2>الجهاز</h2><div class="devbar"><button data-act="plat" data-v="ios" aria-pressed="true">iPhone</button><button data-act="plat" data-v="android" aria-pressed="false">Galaxy</button><button data-act="restart">${I("refresh")} من الأوّل</button></div>`;
ACT.flow = (el) => { closeDialog(); const r = el.dataset.r, reset = { ad: "ad", "ai-photo": "aiph", "ai-quiz": "aiq", challenge: "ch", checkout: "checkout", town: "town" }; if (reset[r]) UI[reset[r]] = null; go(r, el.dataset.pp); };
ACT.plat = (el) => { $("#device").dataset.plat = el.dataset.v; $$(".devbar [data-act=plat]").forEach((b) => b.setAttribute("aria-pressed", b === el)); };
ACT.restart = () => { try { history.replaceState(null, "", "#/home"); } catch (e) {} location.reload(); };
ACT.dismissRotate = () => $("#rotate").classList.add("dismissed");

render();

</script>
